name: Uji jadwal rilis

on:
  push:
    paths: ['scripts/uji_jadwal_rilis.py']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar-xau-uji
  cancel-in-progress: false

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Uji sinyal v1 dekat rilis data 3 bintang
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/uji_jadwal_rilis.py
      - name: Simpan hasil
        run: |
          git config user.name "radar-xau-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uji-rilis.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: uji jadwal rilis $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
