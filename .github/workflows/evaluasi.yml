name: Evaluasi mingguan

on:
  schedule:
    # Minggu 08:17 WIB: backtest ulang dengan data seminggu terakhir + ringkasan Telegram
    - cron: '17 1 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar-xau
  cancel-in-progress: false

jobs:
  evaluasi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Backtest ulang & bandingkan dengan live
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/evaluasi_mingguan.py
      - name: Simpan hasil
        run: |
          git config user.name "radar-xau-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: evaluasi mingguan $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
