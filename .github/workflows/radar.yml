name: Radar XAU

on:
  schedule:
    # Sesi London/NY (14:00–23:59 WIB, Sen–Jum): cek tiap 15 menit, sinyal dari candle H1 yang baru tutup
    - cron: '3,18,33,48 7-16 * * 1-5'
    # Di luar sesi: cek tiap jam untuk memantau TP/SL/24 jam sinyal yang masih jalan
    - cron: '8 0-6,17-23 * * 1-5'
    - cron: '8 0-17 * * 6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar-xau
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Jalankan radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISK_USDT: '10'
        run: python scripts/radar_xau.py
      - name: Simpan state
        if: always()
        run: |
          git config user.name "radar-xau-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "tidak ada perubahan"; exit 0; fi
          git commit -m "data: update radar $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
